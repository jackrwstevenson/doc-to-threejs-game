name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 tools/validate.py
      - run: ./tools/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
